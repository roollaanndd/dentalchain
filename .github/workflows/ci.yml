name: CI

# Typecheck, tests and a production build. This is what gates a pull
# request. Deployment lives in deploy-pages.yml and is deliberately kept
# separate: whether the repository has a Pages site configured says nothing
# about whether the code is correct, and it should not turn a PR red.

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Proves the app actually compiles for both targets a deploy uses.
      - name: Build (root base)
        run: npm run build

      - name: Build (GitHub Pages sub-path)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
