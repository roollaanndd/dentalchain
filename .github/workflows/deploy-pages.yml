name: Deploy to GitHub Pages

# Not run on pull requests: a missing Pages site is a repository setting,
# not a code defect, and must not report as a failing PR check. CI (see
# ci.yml) is what gates a PR.
#
# NOTE: this needs Pages enabled on the repository first —
# Settings -> Pages -> Source: "GitHub Actions". The workflow token cannot
# create the Pages site itself (that needs admin scope), so until then this
# workflow fails at "Configure Pages" by design.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one wait rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # enablement:true self-enables Pages only where the workflow token has
      # admin scope; on this repository it does not, so Pages must be turned
      # on once by hand (see the note at the top of this file).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Pages has no SPA rewrite, so a hard refresh of /app/pinjam would 404.
      # Serving index.html as the 404 page hands the route back to the router.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Pages ignores files starting with an underscore unless this exists.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
